<html lang="en">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Palm Springs Times – Local News</title>

<style>
  :root {
    --ink: #111010;
    --paper: #f5f0e8;
    --cream: #ede8dc;
    --red: #b01a1a;
    --gold: #c4952a;
    --mid: #5a5245;
    --rule: #2a2420;
    --col-width: 720px;
  }


  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }


  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Libre Baskerville', Georgia, serif;
    font-size: 15px;
    line-height: 1.65;
  }


  /* ── TOP BAR ── */
  .topbar {
    background: var(--rule);
    color: #ccc;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 11px;
    letter-spacing: .08em;
    text-transform: uppercase;
    padding: 5px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .topbar strong { color: #fff; }


  /* ── MASTHEAD ── */
  .masthead {
    text-align: center;
    padding: 22px 32px 10px;
    border-bottom: 3px solid var(--rule);
    position: relative;
  }
  .masthead-kicker {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--mid);
    margin-bottom: 6px;
  }
  .masthead h1 {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(36px, 6vw, 72px);
    font-weight: 900;
    letter-spacing: -.02em;
    line-height: 1;
    color: var(--rule);
    text-transform: uppercase;
